<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Puzzles | UVic Investment Group</title>
<meta name="theme-color" content="#0A1F3D">
<meta name="description" content="UVIG's weekly investment crossword and market trivia.">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .pz-shell{position:relative; z-index:1; max-width:1040px; margin:0 auto; padding:44px 24px 80px;}
  .pz-intro{text-align:center; margin-bottom:28px;}
  .pz-intro h1{font-size:44px; letter-spacing:-0.01em; animation:heroFadeUp .7s var(--ease) both .12s;}
  .pz-intro .hero-eyebrow{animation:heroFadeUp .7s var(--ease) both .04s;}
  .pz-intro p{color:var(--graphite); font-size:16px; max-width:46ch; margin:12px auto 0; animation:heroFadeUp .7s var(--ease) both .2s;}
  .pz-mode{display:flex; justify-content:center; align-items:center; gap:18px; margin-bottom:34px; flex-wrap:wrap; animation:heroFadeUp .7s var(--ease) both .28s;}
  .pz-panel{display:none;}
  .pz-panel.active{display:block; animation:teamPanelIn .45s cubic-bezier(.22,1,.36,1);}

  .quick-toggle{display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none;}
  .quick-toggle-track{
    position:relative; width:42px; height:24px; border-radius:999px; background:#DDE1E8;
    transition:background .2s ease; flex-shrink:0;
  }
  .quick-toggle-track::after{
    content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:var(--white); box-shadow:0 1px 3px rgba(10,31,61,.25); transition:transform .2s ease;
  }
  .quick-toggle input{position:absolute; opacity:0; width:0; height:0;}
  .quick-toggle input:checked ~ .quick-toggle-track{background:var(--brass);}
  .quick-toggle input:checked ~ .quick-toggle-track::after{transform:translateX(18px);}
  .quick-toggle-label{font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--navy-900);}
  .quick-toggle-sub{font-size:12px; color:var(--graphite); font-weight:400;}

  .score-submit{margin-top:18px; padding-top:18px; border-top:1px solid rgba(255,255,255,.15); position:relative;}
  .score-submit p{color:#C9D2E0; font-size:13.5px; margin-bottom:12px;}
  .score-submit-form{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .score-submit-form input{
    font-family:var(--sans); font-size:14px; padding:10px 14px; border-radius:999px; border:1.5px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08); color:var(--white); min-width:180px;
  }
  .score-submit-form input::placeholder{color:#9AA7BC;}
  .score-submit-form input:focus{outline:none; border-color:var(--brass);}
  .score-submit.sent p{color:#B7E4C7;}
  .tv-result .score-submit{border-top:1px solid var(--hairline); margin-top:24px;}
  .tv-result .score-submit p{color:var(--graphite);}
  .tv-result .score-submit-form input{
    border:1.5px solid var(--hairline); background:var(--white); color:var(--ink);
  }
  .tv-result .score-submit-form input:focus{border-color:var(--navy-700);}
  .tv-result .score-submit.sent p{color:var(--green);}

  .cw-toolbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .cw-toolbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .cw-timer{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:16px; font-weight:500;
    color:var(--navy-900); background:var(--white); padding:9px 16px; border-radius:999px; box-shadow:var(--shadow-soft);
  }
  .cw-timer svg{width:15px; height:15px; color:var(--brass);}
  .cw-tool-btn{
    font-family:var(--sans); font-size:13.5px; font-weight:600; color:var(--navy-900); background:var(--white);
    border:none; padding:10px 16px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow-soft);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .cw-tool-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-lift);}
  .cw-tool-btn:active{transform:scale(.97);}

  .cw-toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px); opacity:0; pointer-events:none; z-index:100;
    background:var(--navy-900); color:var(--white); font-size:14px; padding:12px 20px; border-radius:999px;
    box-shadow:0 12px 30px rgba(10,31,61,.25); transition:opacity .25s ease, transform .35s cubic-bezier(.22,1,.36,1);
  }
  .cw-toast.show{opacity:1; transform:translate(-50%, 0);}

  .cw-board{display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(260px, 1fr); gap:24px; align-items:start;}
  .cw-grid-card{
    background:linear-gradient(160deg, #F2EEE4 0%, #E8ECF2 100%); border-radius:28px; padding:22px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .cw-current-clue{
    display:flex; gap:12px; align-items:center; background:var(--white); border-radius:16px;
    padding:12px 16px; margin-bottom:18px; min-height:50px; box-shadow:var(--shadow-soft);
  }
  .cw-current-clue .num{
    flex-shrink:0; font-family:var(--sans); font-size:12px; font-weight:600; color:var(--white); background:var(--navy-900);
    border-radius:999px; padding:4px 10px; letter-spacing:.02em;
  }
  .cw-current-clue .txt{font-size:14.5px; color:var(--ink); line-height:1.4;}
  .cw-grid-area{width:100%; min-width:0; display:flex; justify-content:center;}
  .cw-grid{display:grid; gap:var(--gap, 5px); grid-template-columns:repeat(var(--cols, 11), var(--cell, 40px));}
  .cw-cell{
    position:relative; width:var(--cell, 40px); height:var(--cell, 40px); border-radius:calc(var(--cell, 40px) * .24);
    background:var(--white); box-shadow:0 1px 2px rgba(10,31,61,.10), inset 0 0 0 1px rgba(10,31,61,.07);
    transition:background .2s ease, box-shadow .2s ease, transform .15s ease;
  }
  .cw-cell.cw-black{background:transparent; box-shadow:none;}
  .cw-cell.cw-active{background:#F6ECD6;}
  .cw-cell.cw-current{background:#E6CE98; box-shadow:0 4px 12px rgba(185,154,91,.35);}
  .cw-cell.cw-wrong{background:#F7D9D4; animation:cwShake .4s;}
  .cw-cell.cw-pop{animation:cwPop .22s ease;}
  .cw-number{
    position:absolute; top:calc(var(--cell, 40px) * .07); left:calc(var(--cell, 40px) * .12);
    font-family:var(--sans); font-size:max(8px, calc(var(--cell, 40px) * .22)); font-weight:600; color:var(--graphite);
    line-height:1; pointer-events:none;
  }
  .cw-input{
    width:100%; height:100%; border:none; background:transparent; text-align:center; padding:0;
    padding-top:calc(var(--cell, 40px) * .08);
    font-family:var(--sans); font-weight:600; font-size:max(16px, calc(var(--cell, 40px) * .46)); color:var(--navy-900);
    text-transform:uppercase; outline:none; caret-color:transparent; cursor:pointer; border-radius:inherit;
  }
  .cw-grid.solved .cw-cell:not(.cw-black){animation:cwWave .7s cubic-bezier(.22,1,.36,1) both; animation-delay:calc(var(--i) * 18ms);}
  .cw-grid.solved .cw-input{color:var(--white);}
  .cw-grid.solved .cw-number{color:rgba(255,255,255,.6);}
  @keyframes cwPop{50%{transform:scale(1.1);}}
  @keyframes cwShake{25%{transform:translateX(-3px);} 75%{transform:translateX(3px);}}
  @keyframes cwWave{
    0%{transform:scale(1); background:var(--white);}
    40%{transform:scale(1.14);}
    100%{transform:scale(1); background:var(--navy-900); box-shadow:0 4px 10px rgba(10,31,61,.25);}
  }

  .cw-clues{background:var(--white); border-radius:28px; padding:26px 22px; box-shadow:var(--shadow-soft);}
  .cw-clue-group + .cw-clue-group{margin-top:22px;}
  .cw-clue-group h3{font-family:var(--sans); font-size:12px; font-weight:600; letter-spacing:.08em; color:var(--brass); margin:0 0 10px 8px;}
  .cw-clue-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .cw-clue-item{
    display:flex; gap:10px; font-size:14px; line-height:1.45; color:var(--graphite); cursor:pointer;
    padding:8px 10px; border-radius:12px; transition:background .2s ease, color .2s ease;
  }
  .cw-clue-item:hover{background:#F6F5F1;}
  .cw-clue-item.active{background:#F6ECD6; color:var(--navy-900);}
  .cw-clue-item.done{color:#9AA3B0; text-decoration:line-through; text-decoration-color:rgba(154,163,176,.6);}
  .cw-clue-num{flex-shrink:0; width:20px; font-family:var(--sans); font-weight:600; color:var(--navy-700);}

  .cw-banner{
    display:none; position:relative; overflow:hidden; background:var(--navy-900); color:var(--white);
    border-radius:28px; padding:30px 32px; margin-bottom:22px; text-align:center;
  }
  .cw-banner::before{
    content:""; position:absolute; width:340px; height:340px; border-radius:50%; top:-170px; right:-80px;
    background:radial-gradient(circle, rgba(185,154,91,.35), transparent 70%);
  }
  .cw-banner.show{display:block; animation:successPop .6s cubic-bezier(.34,1.56,.64,1) both;}
  .cw-banner h2{color:var(--white); font-size:26px; position:relative;}
  .cw-banner p{color:#C9D2E0; margin-top:6px; position:relative;}
  .cw-banner-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; position:relative;}
  .cw-banner .btn-primary{background:var(--white); color:var(--navy-900);}
  .cw-banner .btn-ghost{border-color:rgba(255,255,255,.5); color:var(--white);}
  .cw-banner .btn-ghost:hover{background:rgba(255,255,255,.1);}

  .tv-card{
    max-width:660px; margin:0 auto; background:var(--white); border-radius:32px; padding:36px 36px 32px;
    box-shadow:var(--shadow-soft); position:relative; overflow:hidden;
  }
  .tv-top{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--graphite); margin-bottom:12px;}
  .tv-top strong{color:var(--navy-900); font-weight:600;}
  .tv-progress{height:6px; background:#ECEEF2; border-radius:999px; overflow:hidden; margin-bottom:28px;}
  .tv-progress .fill{height:100%; width:0; border-radius:999px; background:linear-gradient(90deg, var(--brass), #D9C28F); transition:width .5s cubic-bezier(.22,1,.36,1);}
  .tv-body.enter{animation:tvIn .4s cubic-bezier(.22,1,.36,1) both;}
  .tv-body.leave{animation:tvOut .18s ease both;}
  @keyframes tvIn{from{opacity:0; transform:translateX(18px);} to{opacity:1; transform:none;}}
  @keyframes tvOut{to{opacity:0; transform:translateX(-14px);}}
  .tv-q{font-family:var(--serif); font-size:24px; line-height:1.3; color:var(--navy-900); margin-bottom:22px;}
  .tv-options{display:grid; gap:10px;}
  .tv-opt{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; font-family:var(--sans); font-size:15px;
    color:var(--ink); background:#F6F5F1; border:1.5px solid transparent; border-radius:18px; padding:13px 16px;
    cursor:pointer; transition:background .2s ease, border-color .2s ease, transform .15s ease, opacity .2s ease;
  }
  .tv-opt:hover:not(:disabled){background:#EEEBE3; transform:translateX(3px);}
  .tv-opt:disabled{cursor:default;}
  .tv-opt .key{
    flex-shrink:0; width:30px; height:30px; border-radius:50%; background:var(--white); display:flex; align-items:center;
    justify-content:center; font-size:13px; font-weight:600; color:var(--navy-700); transition:background .2s, color .2s;
  }
  .tv-opt.correct{background:#E3F1E8; border-color:var(--green);}
  .tv-opt.correct .key{background:var(--green); color:var(--white);}
  .tv-opt.wrong{background:#F8E2DE; border-color:var(--red); animation:cwShake .4s;}
  .tv-opt.wrong .key{background:var(--red); color:var(--white);}
  .tv-opt.dim{opacity:.55;}
  .tv-explain{margin-top:18px; padding:14px 18px; border-radius:18px; background:#F6ECD6; font-size:14px; color:var(--ink); line-height:1.5; animation:fadeUpSmall .35s var(--ease) both;}
  .tv-explain strong{color:var(--navy-900);}
  .tv-next{display:flex; justify-content:flex-end; margin-top:20px;}
  .tv-hint{font-size:12px; color:#9AA3B0; margin-top:16px; text-align:center;}

  .tv-result{text-align:center; padding:10px 0 4px;}
  .tv-ring{position:relative; width:150px; height:150px; margin:0 auto 18px;}
  .tv-ring svg{width:150px; height:150px; transform:rotate(-90deg);}
  .tv-ring .track{fill:none; stroke:#ECEEF2; stroke-width:10;}
  .tv-ring .bar{fill:none; stroke:var(--brass); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1);}
  .tv-ring .score{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .tv-ring .score b{font-family:var(--serif); font-size:40px; color:var(--navy-900); line-height:1;}
  .tv-ring .score span{font-size:13px; color:var(--graphite); margin-top:4px;}
  .tv-result h2{font-size:26px;}
  .tv-result p{color:var(--graphite); margin-top:8px;}
  .tv-result .actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:24px;}

  .pz-foot{text-align:center; font-size:12.5px; color:#9AA3B0; margin-top:48px;}
  .pz-foot a{color:var(--navy-700);}

  .gm-card{max-width:720px; margin:0 auto; background:var(--white); border-radius:32px; padding:36px; box-shadow:var(--shadow-soft); position:relative; overflow:hidden;}
  .gm-start{text-align:center; padding:10px 0;}
  .gm-start h2{font-size:28px; margin:8px 0 10px;}
  .gm-start p{color:var(--graphite); max-width:46ch; margin:0 auto 22px; line-height:1.6;}
  .gm-rules{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:26px;}
  .gm-rules div{font-family:var(--mono); font-size:12px; color:var(--graphite); background:var(--tint); padding:8px 14px; border-radius:999px;}

  .gm-top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px;}
  .gm-stat{text-align:center; flex:1;}
  .gm-stat b{display:block; font-family:var(--serif); font-size:20px; color:var(--navy-900); line-height:1.1;}
  .gm-stat span{font-size:11px; color:var(--graphite); text-transform:uppercase; letter-spacing:.04em;}
  .gm-price{text-align:center; margin-bottom:14px;}
  .gm-price b{font-family:var(--serif); font-size:42px; color:var(--navy-900); transition:color .15s ease;}
  .gm-price b.up{color:var(--green);}
  .gm-price b.down{color:var(--red);}
  .gm-price .delta{font-family:var(--mono); font-size:13px; margin-left:8px; color:var(--graphite);}
  .gm-chart-wrap{background:#F6F5F1; border-radius:18px; padding:12px; margin-bottom:20px;}
  .gm-chart{width:100%; height:160px; display:block;}
  .gm-actions{display:flex; gap:14px; justify-content:center; margin-bottom:10px;}
  .gm-btn{
    flex:1; max-width:220px; font-family:var(--sans); font-weight:600; font-size:16px; padding:18px; border-radius:18px; border:none; cursor:pointer;
    transition:transform .12s ease, opacity .2s ease;
  }
  .gm-btn:active:not(:disabled){transform:scale(.97);}
  .gm-btn:disabled{opacity:.35; cursor:default;}
  .gm-btn-buy{background:var(--green); color:var(--white);}
  .gm-btn-sell{background:var(--red); color:var(--white);}
  .gm-status{text-align:center; font-size:13px; color:var(--graphite); min-height:18px; margin-bottom:4px;}

  .gm-result{text-align:center; padding:6px 0 4px;}
  .gm-result .pct{font-family:var(--serif); font-size:52px; line-height:1;}
  .gm-result .pct.pos{color:var(--green);}
  .gm-result .pct.neg{color:var(--red);}
  .gm-result-sub{color:var(--graphite); margin:10px 0 6px;}
  .gm-compare{font-size:13.5px; color:var(--graphite); margin-bottom:22px;}
  .gm-board{margin-top:40px; text-align:left;}
  .gm-board h3{font-size:18px; margin-bottom:12px;}
  .gm-board-table{background:#F6F5F1; border-radius:18px; overflow:hidden;}
  .gm-row{display:flex; align-items:center; gap:14px; padding:11px 16px; font-size:13.5px;}
  .gm-row + .gm-row{border-top:1px solid var(--hairline);}
  .gm-row-head{font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--graphite); background:var(--white);}
  .gm-rank{width:22px; flex-shrink:0; font-family:var(--mono); font-weight:600; color:var(--brass);}
  .gm-row-name{flex:1; min-width:0; font-weight:500; color:var(--navy-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gm-row-metric{width:90px; flex-shrink:0; text-align:right; font-family:var(--mono); color:var(--navy-700);}
  .gm-board-empty{padding:20px; text-align:center; color:var(--graphite); font-size:13.5px;}

  @media (max-width: 860px){
    .cw-board{grid-template-columns:minmax(0, 1fr);}
    .pz-intro h1{font-size:34px;}
    .cw-grid-card{padding:14px; border-radius:22px;}
    .tv-card{padding:26px 20px 24px; border-radius:26px;}
    .tv-q{font-size:20px;}
    .gm-card{padding:24px 18px; border-radius:26px;}
    .gm-price b{font-size:34px;}
  }
</style>
</head>
<body>

  <header class="masthead">
    <div class="masthead-inner wrap">
      <a href="/" class="wordmark">UVic Investment Group <small>EST. 2015</small></a>
      <a href="/" class="nav-link" style="font-size:14px;">← Back to site</a>
    </div>
  </header>

  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

  <main class="pz-shell">
    <div class="pz-intro">
      <span class="hero-eyebrow">FROM THE UVIG MARKET BRIEF</span>
      <h1>Weekly Puzzles</h1>
      <p>An investment crossword and a quick round of market trivia. New every week.</p>
    </div>

    <div class="pz-mode">
      <div class="seg" id="modeSeg">
        <button class="active" data-mode="crossword">Crossword</button>
        <button data-mode="trivia">Trivia</button>
        <button data-mode="game">Market Rush</button>
        <span class="seg-ind"></span>
      </div>
      <label class="quick-toggle">
        <input type="checkbox" id="quickToggle">
        <span class="quick-toggle-track"></span>
        <span class="quick-toggle-label">Quick mode <span class="quick-toggle-sub">— about half the length</span></span>
      </label>
    </div>

    <section class="pz-panel active" data-panel="crossword" style="padding:0;">
      <div class="cw-banner" id="cwBanner">
        <h2 id="cwBannerTitle">Solved!</h2>
        <p id="cwBannerText"></p>
        <div class="cw-banner-actions">
          <button class="btn btn-primary" id="cwBannerSwitch"></button>
          <button class="btn btn-ghost" id="cwBannerTrivia">Play the trivia</button>
        </div>
      </div>

      <div class="cw-toolbar">
        <div class="seg seg-sm" id="diffSeg">
          <button class="active" data-diff="easy">Easy</button>
          <button data-diff="hard">Hard</button>
          <span class="seg-ind"></span>
        </div>
        <div class="cw-toolbar-right">
          <span class="cw-timer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
            <span id="cwTimer">0:00</span>
          </span>
          <button class="cw-tool-btn" id="cwCheck">Check</button>
          <button class="cw-tool-btn" id="cwClear">Clear</button>
        </div>
      </div>

      <div class="cw-board">
        <div class="cw-grid-card">
          <div class="cw-current-clue"><span class="num" id="cwCurNum">1A</span><span class="txt" id="cwCurTxt"></span></div>
          <div class="cw-grid-area" id="cwGridArea"><div class="cw-grid" id="cwGrid"></div></div>
        </div>
        <div class="cw-clues">
          <div class="cw-clue-group">
            <h3>ACROSS</h3>
            <ul class="cw-clue-list" id="cwAcross"></ul>
          </div>
          <div class="cw-clue-group">
            <h3>DOWN</h3>
            <ul class="cw-clue-list" id="cwDown"></ul>
          </div>
        </div>
      </div>
    </section>

    <section class="pz-panel" data-panel="trivia" style="padding:0;">
      <div class="cw-toolbar" style="justify-content:center; margin-bottom:22px;">
        <div class="seg seg-sm" id="tvDiffSeg">
          <button class="active" data-diff="easy">Easy</button>
          <button data-diff="hard">Hard</button>
          <span class="seg-ind"></span>
        </div>
      </div>
      <div class="tv-card" id="tvCard"></div>
    </section>

    <p class="pz-foot">UVic Investment Group · <a href="/join.html">Get the Market Brief every two weeks</a></p>
  </main>

  <div class="cw-toast" id="cwToast"></div>

<script>
// Runs once content saved from /admin is loaded (see content-loader.js).
UVIG_READY(function () {
// ---------- Pill segmented controls with a sliding indicator ----------
function initSeg(el, onChange){
  const ind = el.querySelector('.seg-ind');
  const btns = [...el.querySelectorAll('button')];
  const active = () => btns.find(b => b.classList.contains('active'));
  function move(btn){ ind.style.left = btn.offsetLeft + 'px'; ind.style.width = btn.offsetWidth + 'px'; }
  function set(btn, fire){
    btns.forEach(b => b.classList.toggle('active', b === btn));
    move(btn);
    if (fire) onChange(btn);
  }
  btns.forEach(b => b.addEventListener('click', () => { if (!b.classList.contains('active')) set(b, true); }));
  window.addEventListener('resize', () => move(active()));
  ind.style.transition = 'none'; move(active());
  requestAnimationFrame(() => { move(active()); requestAnimationFrame(() => ind.style.transition = ''); });
  if (document.fonts) document.fonts.ready.then(() => move(active()));
  return { select: (pred) => { const b = btns.find(pred); if (b) set(b, false); } };
}

// <generator>
// Crossword layout generator. Deterministic: the same word list and
// seed always produce the same grid, for every visitor.
function hashString(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function extractWords(rows){
  const R = rows.length, C = rows[0].length, out = [];
  const at = (r, c) => (r >= 0 && c >= 0 && r < R && c < C && rows[r][c] !== '.') ? rows[r][c] : null;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
    if (at(r, c) && !at(r, c-1) && at(r, c+1)){ let w = '', cc = c; while (at(r, cc)) w += at(r, cc++); out.push(w); }
    if (at(r, c) && !at(r-1, c) && at(r+1, c)){ let w = '', rr = r; while (at(rr, c)) w += at(rr++, c); out.push(w); }
  }
  return out;
}

function buildCrossword(entries, seed, maxSize){
  maxSize = maxSize || 12;
  const words = entries
    .map(e => ({ answer: String(e.answer).toUpperCase().replace(/[^A-Z]/g, ''), clue: e.clue }))
    .filter(w => w.answer.length >= 2 && w.answer.length <= maxSize);
  const rng = mulberry32(hashString(seed));
  const K = (r, c) => r + ',' + c;
  const solutions = [];
  let bestPartial = null;

  // Fixed limits (not time-based) so every device produces the identical grid.
  for (let attempt = 0; attempt < 40 && solutions.length < 2; attempt++){
    const order = words.map(w => ({ w, k: w.answer.length + rng() * 2.5 })).sort((a, b) => b.k - a.k).map(o => o.w);
    const cells = new Map(), used = new Map(), placed = [];
    let b = { minR: 0, maxR: 0, minC: 0, maxC: 0 }, nodes = 0;

    const fits = (word, r, c, dir) => {
      const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
      if (cells.has(K(r - dr, c - dc)) || cells.has(K(r + dr * word.length, c + dc * word.length))) return -1;
      let crossings = 0;
      for (let i = 0; i < word.length; i++){
        const rr = r + dr * i, cc = c + dc * i, k = K(rr, cc), ex = cells.get(k);
        if (ex !== undefined){
          if (ex !== word[i] || used.get(k).has(dir)) return -1;
          crossings++;
        } else if (cells.has(K(rr + dc, cc + dr)) || cells.has(K(rr - dc, cc - dr))){
          return -1;
        }
      }
      if (Math.max(b.maxR, r + dr * (word.length - 1)) - Math.min(b.minR, r) + 1 > maxSize) return -1;
      if (Math.max(b.maxC, c + dc * (word.length - 1)) - Math.min(b.minC, c) + 1 > maxSize) return -1;
      return crossings;
    };
    const put = (wo, r, c, dir) => {
      const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
      const u = { added: [], touched: [], prevB: { ...b }, dir };
      for (let i = 0; i < wo.answer.length; i++){
        const rr = r + dr * i, cc = c + dc * i, k = K(rr, cc);
        if (!cells.has(k)){ cells.set(k, wo.answer[i]); used.set(k, new Set()); u.added.push(k); }
        used.get(k).add(dir); u.touched.push(k);
        b.minR = Math.min(b.minR, rr); b.maxR = Math.max(b.maxR, rr); b.minC = Math.min(b.minC, cc); b.maxC = Math.max(b.maxC, cc);
      }
      placed.push(wo.answer);
      return u;
    };
    const undo = u => {
      placed.pop();
      u.touched.forEach(k => used.get(k) && used.get(k).delete(u.dir));
      u.added.forEach(k => { cells.delete(k); used.delete(k); });
      b = u.prevB;
    };
    const snapshot = () => {
      const rows = [];
      for (let r = b.minR; r <= b.maxR; r++){ let s = ''; for (let c = b.minC; c <= b.maxC; c++) s += cells.get(K(r, c)) || '.'; rows.push(s); }
      return rows;
    };
    const candidates = wo => {
      const seen = new Set(), out = [];
      for (const [k, letter] of cells){
        const [cr, cc] = k.split(',').map(Number);
        for (let i = 0; i < wo.answer.length; i++){
          if (wo.answer[i] !== letter) continue;
          for (const dir of ['A', 'D']){
            const r = dir === 'D' ? cr - i : cr, c = dir === 'A' ? cc - i : cc;
            const id = r + ',' + c + dir;
            if (seen.has(id)) continue; seen.add(id);
            const x = fits(wo.answer, r, c, dir);
            if (x <= 0) continue;
            const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
            const h = Math.max(b.maxR, r + dr * (wo.answer.length - 1)) - Math.min(b.minR, r) + 1;
            const w = Math.max(b.maxC, c + dc * (wo.answer.length - 1)) - Math.min(b.minC, c) + 1;
            out.push({ r, c, dir, x, score: x * 6 - h * w * 0.08 - Math.abs(h - w) * 0.6 + rng() * 3 });
          }
        }
      }
      return out.sort((a, b2) => b2.score - a.score).slice(0, 5);
    };
    const dfs = i => {
      if (placed.length > (bestPartial ? bestPartial.count : 0)){
        const rows = snapshot();
        if (extractWords(rows).sort().join('|') === [...placed].sort().join('|')) bestPartial = { count: placed.length, rows, placed: [...placed] };
      }
      if (i === order.length){
        const rows = snapshot();
        if (extractWords(rows).sort().join('|') !== [...placed].sort().join('|')) return false;
        solutions.push(rows);
        return true;
      }
      if (++nodes > 1200) return false;
      for (const cand of candidates(order[i])){
        const u = put(order[i], cand.r, cand.c, cand.dir);
        if (dfs(i + 1)) return true;
        undo(u);
      }
      return false;
    };

    put(order[0], 0, 0, rng() < 0.5 ? 'A' : 'D');
    dfs(1);
  }

  // Prefer complete, compact, square-ish grids.
  const rank = rows => rows.length * rows[0].length + Math.abs(rows.length - rows[0].length) * 4;
  let rows, placedAnswers;
  if (solutions.length){
    rows = solutions.sort((a, b2) => rank(a) - rank(b2))[0];
    placedAnswers = new Set(words.map(w => w.answer));
  } else {
    rows = bestPartial.rows;
    placedAnswers = new Set(bestPartial.placed);
  }
  const clueMap = {};
  words.forEach(w => { clueMap[w.answer] = w.clue; });
  const missing = words.filter(w => !placedAnswers.has(w.answer)).map(w => w.answer);
  return { rows, clueMap, missing };
}
// </generator>

// ---------- Quick mode: roughly halves the crossword word list and trivia question count ----------
let quickMode = false;
function getQuestions(){
  const qs = PUZZLES.trivia[tv.diff].questions;
  return quickMode ? qs.slice(0, Math.ceil(qs.length / 2)) : qs;
}

// ---------- Score submission (reuses the Join form's Apps Script endpoint) ----------
const SCORE_ENDPOINT = "https://script.google.com/macros/s/AKfycbxsShfaG-0EgMWCaKdl08aEyKDpgh8jrq8of2TwnrKG2Js0qdV7LcVr4fc9U1cy36B7zg/exec";

function scoreSubmitHTML(id){
  return `
    <div class="score-submit" id="${id}">
      <p>Nice score — want it logged? Submit your name.</p>
      <div class="score-submit-form">
        <input type="text" data-role="name" placeholder="Your name">
        <input type="email" data-role="email" placeholder="you@uvic.ca">
        <button class="btn btn-primary" data-role="submit" type="button">Submit your score</button>
      </div>
      <p class="score-submit-status" data-role="status"></p>
    </div>`;
}

function wireScoreSubmit(container, payload, type){
  if (!container) return;
  type = type || 'puzzleScore';
  const form = container.querySelector('.score-submit-form');
  const status = container.querySelector('[data-role="status"]');
  form.querySelector('[data-role="submit"]').addEventListener('click', () => {
    const name = form.querySelector('[data-role="name"]').value.trim();
    const email = form.querySelector('[data-role="email"]').value.trim();
    if (!name || !email){ status.textContent = 'Add your name and email to submit.'; return; }
    const body = { type, name, email, ...payload };
    if (SCORE_ENDPOINT.startsWith('REPLACE_WITH')) {
      console.warn('UVIG puzzles: SCORE_ENDPOINT is still a placeholder — score was not saved.', body);
    } else {
      fetch(SCORE_ENDPOINT, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body)
      }).catch(err => console.error('UVIG puzzles: score submission failed', err));
    }
    container.classList.add('sent');
    form.style.display = 'none';
    status.textContent = 'Score submitted — nice work!';
  });
}

// ---------- Crossword game ----------
const cw = { diff: 'easy', R: 0, C: 0, cells: [], across: [], down: [], sel: null, dir: 'A', startTime: null, timer: null, solved: false };
const $ = id => document.getElementById(id);

function loadCrossword(diff){
  cw.diff = diff;
  const puzzle = PUZZLES.crossword[diff];
  const words = quickMode ? puzzle.words.slice(0, Math.ceil(puzzle.words.length / 2)) : puzzle.words;
  const layout = buildCrossword(words, PUZZLES.week + '-' + diff + (quickMode ? '-quick' : ''));
  if (layout.missing.length) console.warn('UVIG crossword: these words could not fit and were skipped:', layout.missing.join(', '));

  const rows = layout.rows;
  cw.R = rows.length; cw.C = rows[0].length;
  cw.cells = rows.map(row => [...row].map(ch => ({ sol: ch === '.' ? null : ch, val: '', num: null })));
  cw.across = []; cw.down = [];
  let n = 1;
  const open = (r, c) => r >= 0 && c >= 0 && r < cw.R && c < cw.C && !!cw.cells[r][c].sol;
  for (let r = 0; r < cw.R; r++) for (let c = 0; c < cw.C; c++){
    if (!open(r, c)) continue;
    const a = !open(r, c-1) && open(r, c+1), d = !open(r-1, c) && open(r+1, c);
    if (a || d) cw.cells[r][c].num = n++;
    if (a){ const cellsRef = []; let cc = c; while (open(r, cc)) cellsRef.push([r, cc++]); cw.across.push({ num: cw.cells[r][c].num, dir: 'A', cellsRef }); }
    if (d){ const cellsRef = []; let rr = r; while (open(rr, c)) cellsRef.push([rr++, c]); cw.down.push({ num: cw.cells[r][c].num, dir: 'D', cellsRef }); }
  }
  [...cw.across, ...cw.down].forEach(w => {
    w.answer = w.cellsRef.map(([r, c]) => cw.cells[r][c].sol).join('');
    w.clue = layout.clueMap[w.answer] || '';
  });

  clearInterval(cw.timer); cw.timer = null; cw.startTime = null; cw.solved = false;
  $('cwTimer').textContent = '0:00';
  $('cwBanner').classList.remove('show');
  const oldScore = document.getElementById('cwScoreSubmit');
  if (oldScore) oldScore.remove();
  renderGrid(); renderClues(); sizeGrid();
  const first = cw.across[0] || cw.down[0];
  cw.dir = first.dir; select(first.cellsRef[0][0], first.cellsRef[0][1], false);
}

function renderGrid(){
  const grid = $('cwGrid');
  grid.classList.remove('solved');
  grid.innerHTML = '';
  let i = 0;
  for (let r = 0; r < cw.R; r++) for (let c = 0; c < cw.C; c++){
    const cell = cw.cells[r][c];
    const el = document.createElement('div');
    el.className = 'cw-cell' + (cell.sol ? '' : ' cw-black');
    if (cell.sol){
      el.dataset.r = r; el.dataset.c = c;
      el.style.setProperty('--i', i++);
      if (cell.num){ const s = document.createElement('span'); s.className = 'cw-number'; s.textContent = cell.num; el.appendChild(s); }
      const inp = document.createElement('input');
      inp.className = 'cw-input'; inp.maxLength = 2; inp.autocomplete = 'off'; inp.autocapitalize = 'characters';
      inp.spellcheck = false; inp.setAttribute('aria-label', 'Row ' + (r+1) + ' column ' + (c+1));
      inp.addEventListener('mousedown', e => { e.preventDefault(); onCellClick(r, c); });
      inp.addEventListener('focus', () => { if (!cw.sel || cw.sel[0] !== r || cw.sel[1] !== c) select(r, c, false); inp.select(); });
      inp.addEventListener('keydown', e => onKey(e, r, c));
      inp.addEventListener('input', e => onInput(e, r, c));
      el.appendChild(inp);
      cell.el = el; cell.inp = inp;
    }
    grid.appendChild(el);
  }
  grid.style.setProperty('--cols', cw.C);
}

function sizeGrid(){
  const area = $('cwGridArea');
  const gap = cw.C >= 10 ? 4 : 5;
  const avail = area.clientWidth;
  if (!avail) return;
  const cell = Math.max(22, Math.min(46, Math.floor((avail - gap * (cw.C - 1)) / cw.C)));
  const grid = $('cwGrid');
  grid.style.setProperty('--cell', cell + 'px');
  grid.style.setProperty('--gap', gap + 'px');
}
window.addEventListener('resize', () => { if (cw.R) sizeGrid(); });

function renderClues(){
  const item = w => `<li class="cw-clue-item" data-dir="${w.dir}" data-num="${w.num}"><span class="cw-clue-num">${w.num}</span><span>${w.clue}</span></li>`;
  $('cwAcross').innerHTML = cw.across.map(item).join('');
  $('cwDown').innerHTML = cw.down.map(item).join('');
  document.querySelectorAll('.cw-clue-item').forEach(li => li.addEventListener('click', () => {
    const list = li.dataset.dir === 'A' ? cw.across : cw.down;
    const w = list.find(x => String(x.num) === li.dataset.num);
    cw.dir = w.dir;
    const firstEmpty = w.cellsRef.find(([r, c]) => !cw.cells[r][c].val) || w.cellsRef[0];
    select(firstEmpty[0], firstEmpty[1], true);
  }));
}

const wordAt = (r, c, dir) => (dir === 'A' ? cw.across : cw.down).find(w => w.cellsRef.some(([rr, cc]) => rr === r && cc === c));
const currentWord = () => cw.sel && wordAt(cw.sel[0], cw.sel[1], cw.dir);

function select(r, c, focus = true){
  if (!wordAt(r, c, cw.dir)) cw.dir = cw.dir === 'A' ? 'D' : 'A';
  cw.sel = [r, c];
  highlight();
  if (focus) cw.cells[r][c].inp.focus({ preventScroll: true });
}

function onCellClick(r, c){
  if (cw.solved) return;
  if (cw.sel && cw.sel[0] === r && cw.sel[1] === c && wordAt(r, c, 'A') && wordAt(r, c, 'D')){
    cw.dir = cw.dir === 'A' ? 'D' : 'A';
  }
  select(r, c, true);
}

function highlight(){
  document.querySelectorAll('.cw-cell.cw-active, .cw-cell.cw-current').forEach(el => el.classList.remove('cw-active', 'cw-current'));
  if (cw.solved){ document.querySelectorAll('.cw-clue-item.active').forEach(li => li.classList.remove('active')); return; }
  const w = currentWord();
  if (w) w.cellsRef.forEach(([r, c]) => cw.cells[r][c].el.classList.add('cw-active'));
  const [r, c] = cw.sel;
  cw.cells[r][c].el.classList.add('cw-current');
  document.querySelectorAll('.cw-clue-item').forEach(li => li.classList.toggle('active', !!w && li.dataset.dir === w.dir && li.dataset.num === String(w.num)));
  if (w){ $('cwCurNum').textContent = w.num + (w.dir === 'A' ? 'A' : 'D'); $('cwCurTxt').textContent = w.clue; }
}

function setLetter(r, c, L){
  const cell = cw.cells[r][c];
  cell.val = L; cell.inp.value = L;
  if (L){ cell.el.classList.remove('cw-pop'); void cell.el.offsetWidth; cell.el.classList.add('cw-pop'); }
  cell.el.classList.remove('cw-wrong');
  updateDoneClues();
}

function step(delta){
  const w = currentWord(); if (!w) return;
  const idx = w.cellsRef.findIndex(([r, c]) => r === cw.sel[0] && c === cw.sel[1]);
  const next = w.cellsRef[idx + delta];
  if (next) select(next[0], next[1], true);
  else if (delta > 0) jumpWord(1);
}

function jumpWord(delta){
  const all = [...cw.across, ...cw.down];
  let i = all.indexOf(currentWord());
  for (let n = 0; n < all.length; n++){
    i = (i + delta + all.length) % all.length;
    const target = all[i];
    const empty = target.cellsRef.find(([r, c]) => !cw.cells[r][c].val);
    if (empty || n === all.length - 1){ cw.dir = target.dir; const [r, c] = empty || target.cellsRef[0]; select(r, c, true); return; }
  }
}

function moveArrow(dr, dc){
  const axis = dr ? 'D' : 'A';
  if (cw.dir !== axis && wordAt(cw.sel[0], cw.sel[1], axis)){ cw.dir = axis; highlight(); return; }
  let r = cw.sel[0] + dr, c = cw.sel[1] + dc;
  while (r >= 0 && c >= 0 && r < cw.R && c < cw.C){
    if (cw.cells[r][c].sol){ select(r, c, true); return; }
    r += dr; c += dc;
  }
}

function typeLetter(r, c, L){
  if (cw.solved) return;
  startTimer();
  setLetter(r, c, L);
  if (!checkSolved()) step(1);
}

function onKey(e, r, c){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (/^[a-zA-Z]$/.test(k)){ e.preventDefault(); typeLetter(r, c, k.toUpperCase()); }
  else if (k === 'Backspace'){
    e.preventDefault(); if (cw.solved) return;
    if (cw.cells[r][c].val) setLetter(r, c, '');
    else { step(-1); setLetter(cw.sel[0], cw.sel[1], ''); }
  }
  else if (k === 'Delete'){ e.preventDefault(); if (!cw.solved) setLetter(r, c, ''); }
  else if (k === 'ArrowRight'){ e.preventDefault(); moveArrow(0, 1); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); moveArrow(0, -1); }
  else if (k === 'ArrowDown'){ e.preventDefault(); moveArrow(1, 0); }
  else if (k === 'ArrowUp'){ e.preventDefault(); moveArrow(-1, 0); }
  else if (k === 'Tab' || k === 'Enter'){ e.preventDefault(); jumpWord(e.shiftKey ? -1 : 1); }
  else if (k === ' '){ e.preventDefault(); if (wordAt(r, c, cw.dir === 'A' ? 'D' : 'A')){ cw.dir = cw.dir === 'A' ? 'D' : 'A'; highlight(); } }
}

// Mobile keyboards often don't report the key on keydown, so fall back to the input event.
function onInput(e, r, c){
  const letters = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
  if (letters) typeLetter(r, c, letters.slice(-1));
  else setLetter(r, c, '');
}

function startTimer(){
  if (cw.startTime || cw.solved) return;
  cw.startTime = Date.now();
  cw.timer = setInterval(() => { $('cwTimer').textContent = fmt(Date.now() - cw.startTime); }, 250);
}
const fmt = ms => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function updateDoneClues(){
  [...cw.across, ...cw.down].forEach(w => {
    const full = w.cellsRef.every(([r, c]) => cw.cells[r][c].val);
    const li = document.querySelector(`.cw-clue-item[data-dir="${w.dir}"][data-num="${w.num}"]`);
    if (li) li.classList.toggle('done', full);
  });
}

function checkSolved(){
  for (const row of cw.cells) for (const cell of row) if (cell.sol && cell.val !== cell.sol) return false;
  cw.solved = true;
  clearInterval(cw.timer);
  const time = fmt(Date.now() - cw.startTime);
  $('cwTimer').textContent = time;
  if (document.activeElement) document.activeElement.blur();
  highlight();
  $('cwGrid').classList.add('solved');
  const other = cw.diff === 'easy' ? 'hard' : 'easy';
  const elapsedSec = (Date.now() - cw.startTime) / 1000;
  const timeLimit = { easy: 240, hard: 420 }[cw.diff] * (quickMode ? 0.55 : 1);
  const goodScore = elapsedSec <= timeLimit;
  setTimeout(() => {
    $('cwBannerTitle').textContent = 'Solved in ' + time;
    $('cwBannerText').textContent = `Nice work on the ${cw.diff}${quickMode ? ' quick' : ''} crossword.`;
    $('cwBannerSwitch').textContent = `Try the ${other} one →`;
    $('cwBanner').classList.add('show');
    if (goodScore){
      $('cwBanner').insertAdjacentHTML('beforeend', scoreSubmitHTML('cwScoreSubmit'));
      wireScoreSubmit($('cwScoreSubmit'), { game: 'crossword', difficulty: cw.diff, quickMode, time });
    }
    $('cwBanner').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 900);
  return true;
}

let toastT;
function toast(msg){
  const t = $('cwToast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

$('cwCheck').addEventListener('click', () => {
  if (cw.solved) return;
  let wrong = 0, filled = 0;
  for (const row of cw.cells) for (const cell of row){
    if (!cell.sol || !cell.val) continue;
    filled++;
    if (cell.val !== cell.sol){ wrong++; cell.el.classList.remove('cw-wrong'); void cell.el.offsetWidth; cell.el.classList.add('cw-wrong'); }
  }
  if (!filled) toast('Fill in a few letters first');
  else if (wrong) toast(wrong === 1 ? '1 letter needs another look' : wrong + ' letters need another look');
  else toast('Everything so far is correct');
});

$('cwClear').addEventListener('click', () => loadCrossword(cw.diff));

const diffSeg = initSeg($('diffSeg'), btn => loadCrossword(btn.dataset.diff));
$('cwBannerSwitch').addEventListener('click', () => {
  const other = cw.diff === 'easy' ? 'hard' : 'easy';
  diffSeg.select(b => b.dataset.diff === other);
  loadCrossword(other);
  document.querySelector('.cw-toolbar').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('cwBannerTrivia').addEventListener('click', () => setMode('trivia'));

// ---------- Trivia ----------
const tv = { i: 0, score: 0, answered: false, diff: 'easy' };
let TQ = getQuestions();
const KEYS = ['A', 'B', 'C', 'D', 'E', 'F'];

function tvRender(animate){
  if (tv.i >= TQ.length) return tvResult();
  const q = TQ[tv.i];
  $('tvCard').innerHTML = `
    <div class="tv-top"><span>Question <strong>${tv.i + 1}</strong> of ${TQ.length}</span><span>Score <strong id="tvScore">${tv.score}</strong></span></div>
    <div class="tv-progress"><div class="fill" id="tvFill" style="width:${(tv.i / TQ.length) * 100}%"></div></div>
    <div class="tv-body ${animate ? 'enter' : ''}">
      <div class="tv-q">${q.q}</div>
      <div class="tv-options">
        ${q.options.map((o, idx) => `<button class="tv-opt" data-idx="${idx}"><span class="key">${KEYS[idx]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div id="tvAfter"></div>
    </div>
    <p class="tv-hint">Tip: press A–D to answer, Enter to continue</p>`;
  tv.answered = false;
  document.querySelectorAll('.tv-opt').forEach(b => b.addEventListener('click', () => tvAnswer(+b.dataset.idx)));
}

function tvAnswer(idx){
  if (tv.answered) return;
  tv.answered = true;
  const q = TQ[tv.i];
  const right = idx === q.answer;
  if (right) tv.score++;
  document.querySelectorAll('.tv-opt').forEach(b => {
    const bi = +b.dataset.idx; b.disabled = true;
    if (bi === q.answer) b.classList.add('correct');
    else if (bi === idx) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  $('tvScore').textContent = tv.score;
  $('tvFill').style.width = ((tv.i + 1) / TQ.length * 100) + '%';
  const last = tv.i === TQ.length - 1;
  $('tvAfter').innerHTML = `
    <div class="tv-explain"><strong>${right ? 'Correct.' : 'Not quite.'}</strong> ${q.explain}</div>
    <div class="tv-next"><button class="btn btn-primary" id="tvNext">${last ? 'See your score' : 'Next question →'}</button></div>`;
  $('tvNext').addEventListener('click', tvNext);
}

function tvNext(){
  const body = document.querySelector('.tv-body');
  body.classList.remove('enter'); body.classList.add('leave');
  setTimeout(() => { tv.i++; tvRender(true); }, 170);
}

function tvResult(){
  const pct = tv.score / TQ.length;
  const goodScore = pct >= 0.7;
  const msg = pct === 1 ? ['Perfect score.', 'The trading desk is yours.']
            : pct >= 0.8 ? ['Excellent.', 'You clearly know your markets.']
            : pct >= 0.5 ? ['Solid round.', 'A few more issues of the Market Brief and you\'ll ace it.']
            : ['Good start.', 'The Market Brief covers all of this. You\'ll get there.'];
  const C = 2 * Math.PI * 64;
  $('tvCard').innerHTML = `
    <div class="tv-result tv-body enter">
      <div class="tv-ring">
        <svg viewBox="0 0 150 150"><circle class="track" cx="75" cy="75" r="64"/><circle class="bar" id="tvBar" cx="75" cy="75" r="64" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
        <div class="score"><b id="tvScoreNum">0</b><span>out of ${TQ.length}</span></div>
      </div>
      <h2>${msg[0]}</h2>
      <p>${msg[1]}</p>
      <div class="actions">
        <button class="btn btn-primary" id="tvAgain">Play again</button>
        <button class="btn btn-ghost" id="tvToCw">Try the crossword</button>
      </div>
      ${goodScore ? scoreSubmitHTML('tvScoreSubmit') : ''}
    </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { $('tvBar').style.strokeDashoffset = C * (1 - pct); }));
  let n = 0; const numEl = $('tvScoreNum');
  const tick = setInterval(() => { if (n >= tv.score){ clearInterval(tick); return; } numEl.textContent = ++n; }, Math.max(60, 900 / Math.max(tv.score, 1)));
  if (goodScore) wireScoreSubmit($('tvScoreSubmit'), { game: 'trivia', difficulty: tv.diff, quickMode, score: `${tv.score}/${TQ.length}` });
  $('tvAgain').addEventListener('click', () => { TQ = getQuestions(); tv.i = 0; tv.score = 0; tvRender(true); });
  $('tvToCw').addEventListener('click', () => setMode('crossword'));
}

const tvDiffSeg = initSeg($('tvDiffSeg'), btn => {
  tv.diff = btn.dataset.diff;
  TQ = getQuestions();
  tv.i = 0; tv.score = 0;
  tvRender(true);
});

document.addEventListener('keydown', e => {
  if (document.querySelector('.pz-panel.active').dataset.panel !== 'trivia') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  const idx = KEYS.indexOf(k);
  if (!tv.answered && idx > -1 && tv.i < TQ.length && idx < TQ[tv.i].options.length){ e.preventDefault(); tvAnswer(idx); }
  else if (k === 'ENTER' && tv.answered && $('tvNext')){ e.preventDefault(); tvNext(); }
});

// ---------- Market Rush: arcade trading game ----------
// Same price path for every visitor on a given day (seeded by date),
// so the leaderboard is a fair comparison, not a lottery.
const GM_ROUND_MS = 45000;
const GM_TICKS = 130;
const GM_INTERVAL = GM_ROUND_MS / (GM_TICKS - 1);
const GM_START_CASH = 1000;

function todaySeed(){ return new Date().toISOString().slice(0, 10); }

function generatePricePath(seed, ticks){
  const rng = mulberry32(hashString(seed));
  const prices = [100];
  for (let i = 1; i < ticks; i++){
    let changePct = (rng() - 0.5) * 0.012;
    if (rng() < 0.07) changePct += (rng() - 0.5) * 0.06; // occasional news jolt
    const p = Math.max(5, prices[i - 1] * (1 + changePct));
    prices.push(Number(p.toFixed(2)));
  }
  return prices;
}

const gm = { active: false, paused: false, i: 0, cash: GM_START_CASH, shares: 0, prices: [], timer: null, lastAction: '' };

function gmRenderStart(){
  $('gmCard').innerHTML = `
    <div class="gm-start">
      <span class="hero-eyebrow">ARCADE</span>
      <h2>Market Rush</h2>
      <p>You've got $1,000 and 45 seconds. The price moves every third of a second — buy when you think it'll rise, sell before it falls. Everyone plays today's same market, so it's a fair race to the top of the leaderboard.</p>
      <div class="gm-rules">
        <div>$1,000 starting cash</div>
        <div>45 second round</div>
        <div>All-in, all-out trades</div>
      </div>
      <button class="btn btn-primary" id="gmStart">Start round</button>
    </div>`;
  $('gmStart').addEventListener('click', gmStartRound);
}

function gmStartRound(){
  clearInterval(gm.timer);
  gm.active = true; gm.paused = false;
  gm.i = 0; gm.cash = GM_START_CASH; gm.shares = 0; gm.lastAction = '';
  gm.prices = generatePricePath('market-rush-' + todaySeed(), GM_TICKS);
  gmRenderPlaying();
  gm.timer = setInterval(gmTick, GM_INTERVAL);
}

function gmPortfolioValue(){
  return gm.cash > 0 ? gm.cash : gm.shares * gm.prices[gm.i];
}

function gmRenderPlaying(){
  $('gmCard').innerHTML = `
    <div class="gm-top">
      <div class="gm-stat"><b id="gmTimer">45s</b><span>Time left</span></div>
      <div class="gm-stat"><b id="gmValue">$1,000.00</b><span>Portfolio</span></div>
      <div class="gm-stat"><b id="gmHolding">Cash</b><span>Position</span></div>
    </div>
    <div class="gm-price"><b id="gmPrice">$100.00</b><span class="delta" id="gmDelta"></span></div>
    <div class="gm-chart-wrap"><canvas class="gm-chart" id="gmChart"></canvas></div>
    <div class="gm-actions">
      <button class="gm-btn gm-btn-buy" id="gmBuy">Buy</button>
      <button class="gm-btn gm-btn-sell" id="gmSell" disabled>Sell</button>
    </div>
    <p class="gm-status" id="gmStatus">Round started — good luck.</p>`;
  $('gmBuy').addEventListener('click', () => gmTrade('buy'));
  $('gmSell').addEventListener('click', () => gmTrade('sell'));
  gmDrawChart();
  gmUpdateHud();
}

function gmTrade(kind){
  const price = gm.prices[gm.i];
  if (kind === 'buy' && gm.cash > 0){
    gm.shares = gm.cash / price; gm.cash = 0;
    gm.lastAction = `Bought at $${price.toFixed(2)}`;
  } else if (kind === 'sell' && gm.shares > 0){
    gm.cash = gm.shares * price; gm.shares = 0;
    gm.lastAction = `Sold at $${price.toFixed(2)}`;
  } else return;
  gmUpdateHud();
}

function gmUpdateHud(){
  const price = gm.prices[gm.i];
  $('gmPrice').textContent = '$' + price.toFixed(2);
  $('gmValue').textContent = '$' + gmPortfolioValue().toFixed(2);
  $('gmHolding').textContent = gm.cash > 0 ? 'Cash' : 'In the market';
  $('gmStatus').textContent = gm.lastAction || 'Watching the price...';
  $('gmBuy').disabled = gm.cash === 0;
  $('gmSell').disabled = gm.shares === 0;
  const remaining = Math.max(0, GM_ROUND_MS - gm.i * GM_INTERVAL);
  $('gmTimer').textContent = Math.ceil(remaining / 1000) + 's';
}

function gmTick(){
  const prevPrice = gm.prices[gm.i];
  gm.i++;
  if (gm.i >= gm.prices.length - 1){
    clearInterval(gm.timer);
    gm.active = false;
    gmEndRound();
    return;
  }
  const price = gm.prices[gm.i];
  const dEl = $('gmDelta'), pEl = $('gmPrice');
  const up = price > prevPrice;
  pEl.classList.remove('up', 'down'); pEl.classList.add(up ? 'up' : 'down');
  dEl.textContent = (up ? '▲ ' : '▼ ') + Math.abs(((price - prevPrice) / prevPrice) * 100).toFixed(2) + '%';
  gmUpdateHud();
  gmDrawChart();
}

function gmDrawChart(){
  const canvas = $('gmChart');
  if (!canvas) return;
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth - 24, h = 160;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const visible = gm.prices.slice(0, gm.i + 1);
  if (visible.length < 2) return;
  const min = Math.min(...visible), max = Math.max(...visible);
  const pad = (max - min) * 0.1 || 1;
  const lo = min - pad, hi = max + pad;
  const x = idx => (idx / (gm.prices.length - 1)) * w;
  const y = p => h - ((p - lo) / (hi - lo)) * h;
  ctx.beginPath();
  visible.forEach((p, idx) => { const px = x(idx), py = y(p); if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
  ctx.strokeStyle = '#163862'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.lineTo(x(visible.length - 1), h); ctx.lineTo(x(0), h); ctx.closePath();
  ctx.fillStyle = 'rgba(22,56,98,0.08)'; ctx.fill();
}
window.addEventListener('resize', () => { if (gm.i > 0) gmDrawChart(); });

function gmEndRound(){
  const finalPrice = gm.prices[gm.prices.length - 1];
  const finalValue = gm.cash > 0 ? gm.cash : gm.shares * finalPrice;
  const returnPct = ((finalValue - GM_START_CASH) / GM_START_CASH) * 100;
  const bhShares = GM_START_CASH / gm.prices[0];
  const bhValue = bhShares * finalPrice;
  const bhReturnPct = ((bhValue - GM_START_CASH) / GM_START_CASH) * 100;
  const beat = returnPct > bhReturnPct;
  $('gmCard').innerHTML = `
    <div class="gm-result">
      <span class="hero-eyebrow">ROUND OVER</span>
      <div class="pct ${returnPct >= 0 ? 'pos' : 'neg'}">${returnPct >= 0 ? '+' : ''}${returnPct.toFixed(1)}%</div>
      <p class="gm-result-sub">Final portfolio: $${finalValue.toFixed(2)}</p>
      <p class="gm-compare">Buy-and-hold today returned ${bhReturnPct >= 0 ? '+' : ''}${bhReturnPct.toFixed(1)}% — you ${beat ? 'beat' : 'trailed'} it.</p>
      <div class="actions" style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" id="gmAgain">Play again</button>
        <button class="btn btn-ghost" id="gmToCw">Try the crossword</button>
      </div>
      ${scoreSubmitHTML('gmScoreSubmit')}
      <div class="gm-board">
        <h3>Today's leaderboard</h3>
        <div class="gm-board-table">
          <div class="gm-row gm-row-head"><span class="gm-rank">#</span><span class="gm-row-name">Name</span><span class="gm-row-metric">Return</span></div>
          <div id="gmBoardRows"><div class="gm-board-empty">Loading…</div></div>
        </div>
      </div>
    </div>`;
  wireScoreSubmit($('gmScoreSubmit'), { game: 'market-rush', seed: todaySeed(), finalValue: finalValue.toFixed(2), returnPct: returnPct.toFixed(2) }, 'gameScore');
  $('gmAgain').addEventListener('click', gmStartRound);
  $('gmToCw').addEventListener('click', () => setMode('crossword'));
  gmLoadLeaderboard();
}

function gmLoadLeaderboard(){
  const rowsEl = $('gmBoardRows');
  if (!rowsEl) return;
  if (SCORE_ENDPOINT.startsWith('REPLACE_WITH')){
    rowsEl.innerHTML = `<div class="gm-board-empty">Leaderboard isn't connected yet.</div>`;
    return;
  }
  fetch(`${SCORE_ENDPOINT}?type=gameLeaderboard&seed=${encodeURIComponent(todaySeed())}`)
    .then(r => r.json())
    .then(data => {
      const rows = (data && data.leaderboard) || [];
      if (!rows.length){ rowsEl.innerHTML = `<div class="gm-board-empty">No runs yet today — be the first.</div>`; return; }
      rowsEl.innerHTML = rows.map((r, i) => `
        <div class="gm-row">
          <span class="gm-rank">${i + 1}</span>
          <span class="gm-row-name">${r.name || 'Anonymous'}</span>
          <span class="gm-row-metric">${Number(r.returnPct) >= 0 ? '+' : ''}${Number(r.returnPct).toFixed(1)}%</span>
        </div>`).join('');
    })
    .catch(() => { rowsEl.innerHTML = `<div class="gm-board-empty">Leaderboard is temporarily unavailable.</div>`; });
}

// ---------- Mode switching. /crossword#trivia opens straight to trivia ----------
const modeSeg = initSeg($('modeSeg'), btn => setMode(btn.dataset.mode, true));
function setMode(mode, fromSeg){
  if (!fromSeg) modeSeg.select(b => b.dataset.mode === mode);
  if (mode !== 'game' && gm.active){
    clearInterval(gm.timer);
    gm.active = false; gm.paused = true;
  }
  document.querySelectorAll('.pz-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === mode));
  const quickToggleEl = document.querySelector('.quick-toggle');
  if (quickToggleEl) quickToggleEl.style.display = mode === 'game' ? 'none' : '';
  history.replaceState(null, '', mode === 'trivia' ? '#trivia' : mode === 'game' ? '#game' : location.pathname);
  if (mode === 'crossword') sizeGrid();
  if (mode === 'game' && gm.paused){ gm.paused = false; gmRenderStart(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('quickToggle').addEventListener('change', e => {
  quickMode = e.target.checked;
  loadCrossword(cw.diff);
  TQ = getQuestions();
  tv.i = 0; tv.score = 0;
  tvRender(false);
});

loadCrossword('easy');
tvRender(false);
gmRenderStart();
if (location.hash === '#trivia') setMode('trivia');
else if (location.hash === '#game') setMode('game');
});
